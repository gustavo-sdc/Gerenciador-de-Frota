<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirme seu cadastro no Garagem</title>
  </head>
  <body style="margin:0;padding:32px 16px;background:#f4f3ef;font-family:Arial,Helvetica,sans-serif;color:#172334;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #d9e0e5;border-radius:12px;">
      <tr>
        <td align="center" style="padding:32px 28px 12px;">
          <img src="{{ .SiteURL }}/garagem-icon-192.png" width="72" height="72" alt="Garagem" style="display:block;width:72px;height:72px;border:0;" />
        </td>
      </tr>
      <tr>
        <td style="padding:8px 32px 32px;text-align:center;">
          <h1 style="margin:0 0 16px;font-size:24px;line-height:1.3;color:#172334;">Confirme seu cadastro</h1>
          <p style="margin:0 0 24px;font-size:16px;line-height:1.6;color:#39495a;">
            Seu espaço no Garagem está quase pronto. Confirme seu endereço de e-mail para acessar sua conta.
          </p>
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 24px;border-radius:8px;background:#172334;color:#ffffff;text-decoration:none;font-size:16px;font-weight:bold;">
            Confirmar meu e-mail
          </a>
          <p style="margin:24px 0 0;font-size:14px;line-height:1.6;color:#687787;">
            Se você não criou uma conta no Garagem, ignore esta mensagem.
          </p>
        </td>
      </tr>
    </table>
    <p style="max-width:560px;margin:20px auto 0;text-align:center;font-size:12px;line-height:1.5;color:#687787;">
      Garagem · Gestão de frota e manutenção
    </p>
  </body>
</html>
